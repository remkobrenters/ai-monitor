name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install system test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y python3 python3-gi gjs gir1.2-adw-1 libglib2.0-bin nodejs
      - name: Check source and behavior
        run: make check
      - name: Package the release
        run: make dist
